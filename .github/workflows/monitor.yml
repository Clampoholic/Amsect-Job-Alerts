name: AmSECT Job Alerts Daily

on:
  schedule:
    - cron: "23 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Verify Discord webhook configuration
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.AMSECTPOSTINGS }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::error::Discord webhook is empty. Check the AMSECTPOSTINGS repository secret."
            exit 1
          fi
          echo "Discord webhook secret is present."

      - name: Run job monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.AMSECTPOSTINGS }}
        run: python monitor.py

      - name: Save seen jobs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f seen_jobs.json ]; then
            git add seen_jobs.json
            git diff --cached --quiet || git commit -m "Update seen jobs"
            git push
          fi
