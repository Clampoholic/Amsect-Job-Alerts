
name: Repost 5 AmSECT Jobs

on:
  workflow_dispatch:

jobs:
  repost-five:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Repost five jobs to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.AMSECTPOSTINGS }}
        run: |
          python - <<'PY'
          import requests
          from monitor import PAGE_URL, find_jobs, get_webhook

          webhook = get_webhook()

          response = requests.get(
              PAGE_URL,
              headers={"User-Agent": "Mozilla/5.0"},
              timeout=30,
          )
          response.raise_for_status()

          jobs = list(find_jobs(response.text).values())

          if not jobs:
              raise RuntimeError("No AmSECT jobs found.")

          selected = jobs[:5]

          print(f"Found {len(jobs)} jobs.")
          print(f"Reposting {len(selected)} jobs.")

          for job in selected:
              message = (
                  "🫀 **AmSECT Job Posting — Repost**\n"
                  f"**{job['title']}**\n"
                  f"{job['url']}"
              )

              result = requests.post(
                  webhook,
                  json={
                      "content": message,
                      "allowed_mentions": {"parse": []},
                  },
                  timeout=20,
              )
              result.raise_for_status()
              print(f"Posted: {job['title']}")

          print("Repost test complete!")
          PY
